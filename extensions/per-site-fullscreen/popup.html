<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  body { width: 260px; padding: 12px; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 2px; overflow-wrap: anywhere; }
  #none { margin: 4px 0 8px; }
  .choices { margin: 8px 0 10px; }
  #rule { margin: 0 0 8px; }
  footer { border-top: 1px solid var(--line); padding-top: 8px; display: flex; justify-content: flex-end; }
  #warn { margin-bottom: 8px; }
</style>
</head>
<body>
  <h1 id="site">This site</h1>
  <div id="none" class="muted" hidden>Fullscreen can't be set for this page.</div>
  <div id="rule" class="muted" hidden></div>
  <div id="pick" class="choices" role="radiogroup" aria-label="Fullscreen"></div>
  <div id="warn" class="warn" hidden>Full screen is kept inside the window by <code>full-screen-api.ignore-widgets</code> in about:config. Set it to false.</div>
  <footer><button id="options">All sites…</button></footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
