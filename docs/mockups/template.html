<!doctype html><html><head><meta charset=utf8><title>Mockup builder template</title>
<!-- See docs/MOCKUPS.md. One MODS entry per element: options (o), review notes, a bar() and a fly() that build HTML from the state. -->
<style>
@font-face{font-family:"UbuntuMono NF";src:local("UbuntuMono Nerd Font"),local("Ubuntu Mono");font-weight:400}
@font-face{font-family:"UbuntuMono NF";src:local("UbuntuMono Nerd Font Bold"),local("Ubuntu Mono Bold");font-weight:700}
:root{--base:#0b0b0b;--bar:#121212;--panel:#1a1a1a;--rows:#141414;--overlay:#242424;--border:#303030;--muted:#4d4d4d;--subtext:#7a7a7a;--text:#d0e2fa;--bright:#ebebeb;--accent:#5555c8;--mark:#7777dd;--alert:#d9645a;--mono:"UbuntuMono NF","Ubuntu Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--text);font:700 16px var(--mono)}
.wrap{max-width:1500px;margin:0 auto;padding:22px 16px 90px;display:grid;gap:16px}
h2{font-size:14px;letter-spacing:1px;margin:0;display:flex;gap:10px;align-items:center}h2::before{content:"//";color:var(--mark)}h2::after{content:"";flex:1;height:1px;background:var(--border)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;background:var(--base);padding:8px 0}
.tabs button,.sg button,.reset,#copy{font:inherit;font-size:12px;color:var(--subtext);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer}
.tabs button[aria-selected=true],.sg button.on,#copy{background:var(--accent);color:#fff;border-color:var(--accent)}
.main{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.ctl,.pv{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:12px;display:grid;gap:10px}
.oc{display:grid;gap:4px;padding:6px 8px;border-radius:6px;background:var(--rows);border:1px solid var(--border)}
.ol{display:flex;gap:6px;align-items:center;font-size:13px}.ol span{flex:1}
.tag{font:700 9px var(--mono);padding:1px 6px;border-radius:8px;text-transform:uppercase;font-style:normal}
.tag.S{background:#26354f;color:#8fb4e8}.tag.N{background:var(--accent);color:#fff}.tag.P{background:#3a3a3a;color:#bbb}
.sw{width:34px;height:18px;border-radius:9px;border:1px solid var(--muted);background:var(--base);position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:var(--subtext)}.sw.on{background:var(--accent)}.sw.on::after{left:19px;background:#fff}
.sg{display:flex;flex-wrap:wrap;gap:3px}.pv textarea{width:100%;min-height:90px;background:var(--rows);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font:400 13px/1.5 var(--mono)}
.zs{zoom:2.6;width:max-content}.zf{zoom:1.35;width:max-content}
.sbar{height:31px;background:var(--bar);border-bottom:1px solid var(--border);padding:3px 6px;display:flex;gap:6px;align-items:center}
.ch{height:24px;border:1px solid var(--border);border-radius:6px;box-shadow:inset 0 0 0 2px var(--bar),inset 0 0 0 3px var(--muted);display:flex;align-items:center;gap:6px;padding:0 var(--pad,7px);font-size:11px}.ch.gh{width:34px;opacity:.28;padding:0}.ch svg{width:13px;height:13px}
.panel{width:316px;background:var(--panel);border:1px solid var(--border);border-radius:7px;box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px var(--muted);padding:13px 9px 9px;font-size:13px;display:grid;gap:8px}.panel svg{width:15px;height:15px}
.head{display:flex;gap:7px;align-items:center;padding:0 6px 2px}.head::before{content:"//";color:var(--mark)}.head::after{content:"";flex:1;height:1px;background:var(--border);order:1}
.rows{background:var(--rows);border:1px solid var(--border);border-radius:6px;box-shadow:inset 0 0 0 1px var(--rows),inset 0 0 0 2px var(--muted);padding:4px}
.row{position:relative;min-height:30px;display:flex;align-items:center;gap:8px;padding:3px 7px 3px 10px;border-radius:4px}.row .l{flex:1}.row .v{color:var(--subtext);font-weight:400}
.row.hl{background:var(--overlay)}.row.hl::before{content:"";position:absolute;left:3px;top:7px;bottom:7px;width:2px;background:var(--accent);border-radius:1px}
.bar-sum{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--border);padding:8px 16px;display:flex;gap:12px;font-size:12px}#sum{flex:1;color:var(--subtext);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class=wrap><h2>TITLE</h2><div class=tabs id=tabs></div><div id=view></div></div>
<div class=bar-sum><span id=sum></span><button id=copy>Copy picks</button></div>
<script>
// icons: add 24x24 stroke paths as needed
const P={chev:'M9 6l6 6-6 6',bolt:'M13 2L4 14h7l-1 8 9-12h-7z'};
const I=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
// flyout builders
const H=t=>`<div class=head>${t}</div>`;
const R=(ic,l,v='',o={})=>`<div class="row ${o.hl?'hl':''}">${ic?I(ic):''}<span class=l>${l}</span><span class=v>${v}</span></div>`;
const S=(...r)=>`<div class=rows>${r.join('')}</div>`;
const PN=(...b)=>`<div class=panel>${b.join('')}</div>`;
const BAR=(inner,cls='')=>`<div class=sbar><div class="ch gh"></div><div class="ch ${cls}">${inner}</div><div class="ch gh"></div></div>`;
// option: O(where 'b'|'f'|'p', key, label, 't'|'s', source 'S'|'N'|'P', default, choices, hint)
const O=(w,k,l,t,s,d,o,h)=>({w,k,l,t,s,d,o,h});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const MODS=[{
 id:'example',name:'Example',
 notes:['What feels off, from the code.'],set:'Settings that already exist here (unchanged)',
 o:[O('b','style','Bar shows','s','N','Icon',['Icon','Icon + value']),O('f','hero','Headline first','t','N',0),O('p','alert','Preview: alert','t','P',0)],
 bar:v=>BAR(I('bolt')+(v.style==='Icon + value'?'<span>62%</span>':'')),
 fly:v=>PN(H('EXAMPLE'),S(R('bolt','Row','value',{hl:1}),R('bolt','Another','value')))
}];
const st={},cm={},pad={v:'normal'};let cur=MODS[0].id;
MODS.forEach(m=>{st[m.id]={};m.o.forEach(o=>st[m.id][o.k]=o.d)});
const changed=m=>m.o.filter(o=>o.s==='N'&&st[m.id][o.k]!==o.d);
function lines(){return MODS.filter(m=>changed(m).length||(cm[m.id]||'').trim()).map(m=>({n:m.name,ch:changed(m).map(o=>o.t==='t'?o.l:`${o.l} → ${st[m.id][o.k]}`).join(', '),cm:(cm[m.id]||'').trim()}))}
function ctl(m){const g=(w,t)=>{const os=m.o.filter(o=>o.w===w);return os.length?`<h2>${t}</h2>`+os.map(o=>`<div class=oc><div class=ol><span>${o.l}</span><i class="tag ${o.s}">${{S:'Settings',N:'New',P:'Preview'}[o.s]}</i></div>${o.h?`<small>${o.h}</small>`:''}${o.t==='t'?`<button class="sw ${st[m.id][o.k]?'on':''}" data-k="${o.k}"></button>`:`<div class=sg>${o.o.map(c=>`<button class="${st[m.id][o.k]===c?'on':''}" data-k="${o.k}" data-v="${c}">${c}</button>`).join('')}</div>`}</div>`).join(''):''};
 return g('b','Bar module')+g('f','Flyout')+g('p','Preview state')+'<button class=reset data-reset=1>Keep the current design</button>'}
function render(){
 tabs.innerHTML=MODS.map(m=>`<button role=tab aria-selected="${m.id===cur}" data-t="${m.id}">${m.name}</button>`).join('');
 const m=MODS.find(x=>x.id===cur),v=st[m.id];
 view.innerHTML=`<div class=main><div class=ctl>${ctl(m)}</div><div style="display:grid;gap:12px"><div class=pv><h2>MODULE ON THE BAR</h2><div class=zs>${m.bar(v)}</div></div><div class=pv><h2>FLYOUT</h2><div class=zf>${m.fly(v)}</div></div><div class=pv><h2>COMMENTS</h2><textarea data-cm>${esc(cm[m.id]||'')}</textarea></div></div></div>`;
 const L=lines();sum.textContent=L.length?L.map(l=>`${l.n}: ${l.ch||'no change'}${l.cm?' 💬':''}`).join('  |  '):'Nothing changed from the current design'}
tabs.onclick=e=>{const b=e.target.closest('[data-t]');if(b){cur=b.dataset.t;render()}};
view.oninput=e=>{if(e.target.matches('[data-cm]'))cm[cur]=e.target.value};
view.onclick=e=>{const m=MODS.find(x=>x.id===cur);if(e.target.closest('[data-reset]')){m.o.filter(o=>o.s==='N').forEach(o=>st[m.id][o.k]=o.d);return render()}
 const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;st[m.id][k]=b.dataset.v!==undefined?b.dataset.v:(st[m.id][k]?0:1);render()};
copy.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(lines().map(l=>`${l.n}\n  Changes: ${l.ch||'none (keep current)'}${l.cm?'\n  Comment: '+l.cm:''}`).join('\n\n'));
render();
</script></body></html>
