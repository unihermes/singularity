# Singularity - Starship
# ~/.config/starship.toml
#
# The current folder is an accent pill; a failed command turns the prompt
# character the look's alert colour, and a clean prompt stays plain.
#
# Written in Singularity's ramp, accent and alert. Quickshell
# (AppearanceSync.qml) renders a copy in the current look's colours to
# ~/.local/state/singularity/starship.toml, which .bashrc points
# STARSHIP_CONFIG at, so edit this file, not that one.
#   #0b0b0b base   #121212 bar    #1a1a1a surface  #242424 overlay
#   #303030 border #4d4d4d muted  #7a7a7a subtext  #d0e2fa text
#   #ebebeb bright
#
# Two lines: the path on its own, then the prompt character. Nothing else
# shares the path's line -- git state in particular is deliberately absent.

# Starship prepends a blank line to every prompt unless told not to, which is
# the gap that shows up between fastfetch's output and the first prompt.
add_newline = true

format = """
${custom.path}
$character"""

palette = "singularity"

[palettes.singularity]
text  = "#d0e2fa"
alert = "#a87676"

# The path is drawn by custom.path (starship-path.sh), not this module:
# starship's directory has one style for the whole string. Left disabled
# rather than deleted so it's obvious the omission is deliberate.
[directory]
disabled = true

# The capsule glyphs (U+E0B6/U+E0B4) need a Nerd Font with the rounded
# powerline glyphs, which UbuntuMono has.
[custom.path]
command = "~/.config/starship-path.sh"
when = true
shell = ["bash", "--noprofile", "--norc"]
# no style bracket: the script emits its own SGR, and wrapping it would let
# starship's reset cut the background out from under it
format = "$output"
style = ""

[character]
success_symbol = "[❯](text)"
error_symbol = "[❯](bold alert)"
