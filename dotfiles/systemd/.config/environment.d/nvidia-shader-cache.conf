# Singularity - NVIDIA shader cache settings for apps systemd and D-Bus start
# (autostart entries, Discord, Spotify), which don't get Hyprland's env.lua.
#
# All apps share ~/.cache/nvidia. An app on the default 1 GiB limit that finds
# the cache over it prunes everyone's files, games' included, so every app
# gets the same 10 GiB limit and none of them prunes. Other GPUs' drivers
# ignore these.
__GL_SHADER_DISK_CACHE_SIZE=10737418240
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
