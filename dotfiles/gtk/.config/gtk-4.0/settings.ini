# Only what the shell doesn't manage. The theme, dark or light, icons,
# cursor and font come from gsettings, which Quickshell's AppearanceSync
# keeps in step with the Appearance page -- GTK3 on Wayland reads them there
# directly, and GTK4 through the settings portal, which outranks this file.
[Settings]
gtk-decoration-layout=:
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
