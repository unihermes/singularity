# Singularity - hypridle
# ~/.config/hypr/hypridle.conf
#
# Idle ladder: dim -> lock -> screens off -> suspend. Started from
# hyprland.lua's autostart block. Suspend comes at 10 min on battery and 20
# on AC -- see the two suspend listeners at the bottom.
#
# The lid is handled separately, by lid.sh: closing it turns the screen off
# and suspends 5 min later, whatever this ladder or an idle inhibitor says.
# This file only covers sitting idle with the lid open.
#
# hypridle still reads hyprlang, not Lua -- only Hyprland itself moved to
# hyprland.lua, so this file keeps the old syntax.
#
# The bar's Quick Actions "Keep Awake" toggle holds a Wayland idle inhibitor,
# which stops every step below from firing. So does anything playing video
# in a browser (it asks over D-Bus, which hypridle honours by default).
#
# Plain `hyprctl dispatch dpms` silently does nothing under the Lua config --
# dispatchers have to go through hl.dispatch via eval.

general {
    # pidof guard: a second hyprlock on top of the first would need two unlocks
    lock_cmd = pidof hyprlock || hyprlock
    # covers a manual suspend too; after the 20 min step it's already locked
    before_sleep_cmd = loginctl lock-session
    # screen back on -- unless the lid is still shut, in which case lid.sh
    # keeps it off and suspends again shortly (a wake in the bag)
    after_sleep_cmd = ~/.config/hypr/lid.sh resume
}

# 4 min: dim the panel as a warning. -s saves the current level so -r puts
# back exactly what you had, not a fixed value.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off. Any input brings them back.
listener {
    timeout = 330
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# 10 min: suspend, but only on battery. Checked when it fires, not when
# hypridle started, so plugging in or unplugging mid-idle is respected with no
# restart and no udev hook: any charger online (the Mains adapter or a USB-C
# source) and this does nothing, leaving the 20 min step below. The Power
# settings page shows it as "Suspend on battery".
listener {
    timeout = 600
    on-timeout = grep -qsx 1 /sys/class/power_supply/*/online || systemctl suspend
}

# 20 min: suspend, on AC too
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
