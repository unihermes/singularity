# Singularity - hyprlock
# ~/.config/hypr/hyprlock.conf
#
# hyprlock is its own binary with its own hyprlang config, so this keeps the
# old key=value format rather than the compositor's lua one.
#
# Colours, font, corners and strokes come from the shell's look: Quickshell's
# AppearanceSync writes them as variables to the state file sourced below.
# The values here are the fallback until it has, in the grayscale ramp.
#
# Settings -> Lock Screen edits the background block (path, blur_passes,
# brightness) and the clock label's text in place.

$n_base = rgba(0b0b0bff)
$n_surface = rgba(1a1a1aff)
$n_border = rgba(303030ff)
$n_subtext = rgba(7a7a7aff)
$n_text = rgba(d4e4f4ff)
$n_bright = rgba(ebebebff)
$n_focus = rgba(7a7a7aff)
$n_accent = rgba(ebebebff)
$n_alert = rgba(ebebebff)
$n_font = UbuntuMono Nerd Font
$n_radius = 6
$n_bw = 1
$n_fs = 16
$n_fs_clock = 64
source = ~/.local/state/neutrino/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $n_base
    path = ~/.local/state/neutrino/current-wallpaper
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
}

input-field {
    monitor =
    size = 260, 44
    rounding = $n_radius
    outline_thickness = $n_bw
    outer_color = $n_border
    inner_color = $n_surface
    font_color = $n_text
    font_family = $n_font
    check_color = $n_focus
    fail_color = $n_alert
    placeholder_text =
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%a %-d %b  %H:%M"
    color = $n_bright
    font_size = $n_fs_clock
    font_family = $n_font
    position = 0, 90
    halign = center
    valign = center
}
