# Singularity - hyprlock
# ~/.config/hypr/hyprlock.conf
#
# hyprlock is its own binary with its own hyprlang config, so this keeps the
# old key=value format rather than the compositor's lua one.
#
# Colours, font, corners and strokes come from the shell's look: Quickshell's
# AppearanceSync writes them as variables to the state file sourced below.
# The values here are the fallback until it has, in the grayscale ramp.
#
# Settings -> Lock Screen edits the background block (path, blur_passes,
# brightness) and the clock label's text in place. Its clock size and place
# and the info line under the clock come through the variables, like the
# colours: the info line runs lock-info.sh, which prints nothing when every
# part of it is off.

$n_base = rgba(0b0b0bff)
$n_surface = rgba(1a1a1aff)
$n_border = rgba(303030ff)
$n_subtext = rgba(7a7a7aff)
$n_text = rgba(d0e2faff)
$n_bright = rgba(ebebebff)
$n_focus = rgba(5555c8ff)
$n_accent = rgba(5555c8ff)
$n_alert = rgba(ebebebff)
$n_font = UbuntuMono Nerd Font
$n_radius = 6
$n_bw = 1
$n_fs = 16
$n_fs_clock = 64
$n_clock_pos = 0, 90
$n_clock_halign = center
$n_clock_valign = center
$n_info_pos = 0, 40
$n_info_halign = center
$n_info_valign = center
$n_info_args = none
source = ~/.local/state/singularity/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $n_base
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
    path = ~/.local/state/singularity/current-wallpaper
}

input-field {
    monitor =
    size = 260, 44
    rounding = $n_radius
    outline_thickness = $n_bw
    outer_color = $n_border
    inner_color = $n_surface
    font_color = $n_text
    font_family = $n_font
    check_color = $n_focus
    fail_color = $n_alert
    placeholder_text =
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = $n_bright
    font_size = $n_fs_clock
    font_family = $n_font
    position = $n_clock_pos
    halign = $n_clock_halign
    valign = $n_clock_valign
}

# the info line under the clock: date, what's playing, unread notifications
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/lock-info.sh $n_info_args
    color = $n_subtext
    font_size = $n_fs
    font_family = $n_font
    position = $n_info_pos
    halign = $n_info_halign
    valign = $n_info_valign
}
