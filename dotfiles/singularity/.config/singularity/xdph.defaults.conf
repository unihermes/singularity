# Singularity - xdg-desktop-portal-hyprland
# ~/.config/singularity/xdph.defaults.conf
#
# Not read by xdph. link.sh writes it to ~/.config/hypr/xdph.conf on every
# run, with @HOME@ filled in: xdph runs the picker without a shell, so a ~
# in its path is never expanded. Read when the portal starts.

screencopy {
    # hyprland-share-picker, unless ALT+SHIFT+S (discord-share.sh) named the window
    custom_picker_binary = @HOME@/.config/hypr/share-picker.sh
}
