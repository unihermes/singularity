# Singularity - hypridle, the desktop's default
# ~/.config/singularity/hypridle-desktop.defaults.conf
#
# Not read by hypridle. link.sh copies it to ~/.config/hypr/hypridle.conf on
# a desktop that has none yet; that copy is this machine's own, kept out of git,
# and is what Settings > Power & Idle and Lock Screen edit. Changing this
# file only changes what a fresh install starts with. See hypridle-laptop.defaults.conf for the notes on
# the general block, the lid and the battery-only step.
#
# Idle ladder: dim -> screens off -> suspend, slower than the laptop's and
# with no lock of its own (the step is there, switched off, for Settings to
# turn back on). The session still locks before every suspend, through
# before_sleep_cmd.
#
# hypridle still reads hyprlang, not Lua. Keep Awake and a playing video
# hold an idle inhibitor that stops every step below. Plain
# `hyprctl dispatch dpms` does nothing under the Lua config, so dpms goes
# through hl.dispatch via eval.

general {
    # pidof guard: a second hyprlock on top of the first would need two
    # unlocks. The refocus once it exits hands the keyboard back to the
    # active window (see hypridle-laptop.defaults.conf).
    lock_cmd = pidof hyprlock || (hyprlock; hyprctl eval 'local w = hl.get_active_window(); if w then hl.dispatch(hl.dsp.focus({ window = "address:" .. w.address })) end')
    before_sleep_cmd = pidof hyprlock || loginctl lock-session; ~/.config/hypr/lid.sh sleep
    after_sleep_cmd = ~/.config/hypr/lid.sh resume
}

# Not a step: lid.sh's input detector (see hypridle-laptop.defaults.conf). With no
# lid it only keeps the input and idle files lid.sh reads up to date.
listener {
    timeout = 2
    ignore_inhibit = true
    on-timeout = touch "$XDG_RUNTIME_DIR/singularity-idle"
    on-resume = touch "$XDG_RUNTIME_DIR/singularity-input"
}

# 10 min: dim as a warning. -s saves the current level so -r puts back
# exactly what you had.
listener {
    timeout = 600
    on-timeout = brightnessctl -s set 1%
    on-resume = brightnessctl -r
}

# Lock, switched off
#~ listener {
    #~ timeout = 540
    #~ on-timeout = loginctl lock-session
#~ }

# 20 min: screens off. Any input brings them back.
listener {
    timeout = 1200
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
