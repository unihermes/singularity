# Singularity - hypridle, the desktop's default
# ~/.config/singularity/hypridle-desktop.defaults.conf
#
# Not read by hypridle. link.sh copies it to ~/.config/hypr/hypridle.conf on
# a desktop that has none yet; that copy is this machine's own, kept out of git,
# and is what Settings > Power & Idle and Lock Screen edit. Changing this
# file only changes what a fresh install starts with. See hypridle-laptop.defaults.conf for the notes on
# the general block and the laptop-only lid and battery steps.
#
# Idle ladder: dim -> screens off -> suspend -> hibernate (off), slower than the laptop's and
# with no lock of its own (the step is there, switched off, for Settings to
# turn back on). The session still locks before every suspend, through
# before_sleep_cmd.
#
# hypridle still reads hyprlang, not Lua. Keep Awake and a playing video
# hold an idle inhibitor that stops every step below. Plain
# `hyprctl dispatch dpms` does nothing under the Lua config, so dpms goes
# through hl.dispatch via eval -- with a table: hl.dsp.dpms("off"), a bare
# string, is read as a toggle, so the on-resume below would switch screens
# that input had already woken straight back off.

general {
    # pidof guard: a second hyprlock on top of the first would need two
    # unlocks. The refocus once it exits hands the keyboard back to the
    # active window (see hypridle-laptop.defaults.conf).
    lock_cmd = pidof hyprlock || (hyprlock; hyprctl eval 'local w = hl.get_active_window(); if w then hl.dispatch(hl.dsp.focus({ window = "address:" .. w.address })) end')
    before_sleep_cmd = pidof hyprlock || loginctl lock-session; ~/.config/hypr/sleep.sh sleep
    after_sleep_cmd = ~/.config/hypr/sleep.sh resume
}

# 10 min: dim if a backlight exists; never target keyboard LEDs.
# -s saves the current level so -r restores it.
listener {
    timeout = 600
    on-timeout = qs ipc call brightness quietNext >/dev/null 2>&1; [ -n "$(ls -A /sys/class/backlight)" ] && brightnessctl -c backlight -s set 1%
    on-resume = qs ipc call brightness quietNext >/dev/null 2>&1; [ -n "$(ls -A /sys/class/backlight)" ] && brightnessctl -c backlight -r
}

# Lock, switched off
#~ listener {
    #~ timeout = 540
    #~ on-timeout = loginctl lock-session
#~ }

# 20 min: screens off. Any input brings them back.
listener {
    timeout = 1200
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

# 30 min: suspend, through idle-suspend.sh, which makes it
# suspend-then-hibernate while the Hibernate step below is on
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/idle-suspend.sh
}

# 1 h: hibernate, when still awake by then (with suspend set to Never, say);
# asleep already, idle-suspend.sh's suspend-then-hibernate does it instead.
# Off (#~) until turned on in Settings > Power & Idle, which allows that only
# where logind can hibernate (a swapfile and resume= set up).
#~ listener {
#~     timeout = 3600
#~     on-timeout = systemctl hibernate
#~ }
