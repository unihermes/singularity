# Singularity - Alacritty
# ~/.config/alacritty/alacritty.toml

[general]
import = ["~/.local/state/neutrino/alacritty.toml"]

[window]
padding = { x = 12, y = 10 }
opacity = 0.94
decorations = "none"
dynamic_padding = true

[font]
size = 12.0
# UbuntuMono Nerd Font owns every glyph the prompt uses, powerline caps
# included, so nothing is drawn by fallback at another font's metrics. The
# "Mono" variant keeps every glyph to one terminal cell, which is what a grid
# of characters wants.
normal = { family = "UbuntuMono Nerd Font Mono", style = "Regular" }
bold   = { family = "UbuntuMono Nerd Font Mono", style = "Bold" }
italic = { family = "UbuntuMono Nerd Font Mono", style = "Italic" }

[cursor]
# Beam, not Block: a thin vertical bar sitting between characters rather than a
# filled rectangle painted over the one under it.
style = { shape = "Beam", blinking = "On" }
# Default 0.15 is nearly invisible on a beam at this font size.
thickness = 0.25
# When the window loses focus the cursor becomes a hollow box, so you can
# tell at a glance which terminal actually has keyboard input.
unfocused_hollow = true

[scrolling]
history = 10000

# --- colours --------------------------------------------------------------
# Written by the shell (quickshell/services/AppearanceSync.qml) from the active
# look, so the terminal changes with it; alacritty watches imports and recolours
# open windows live. The 16 ANSI slots are a lightness ramp in the look's own
# tones rather than hues, so everything that colours its output -- ls, git diff,
# compiler errors -- stays legible but monochrome. Anything set in this file
# overrides the import, which is why there is no [colors] block here. Until the
# shell has run once the file doesn't exist and alacritty uses its defaults.
