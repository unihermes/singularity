# Singularity - the Game channel as where new playback goes (scripts/channels.lua;
# the channels themselves are in pipewire.conf.d/channels.conf)

wireplumber.components = [
  {
    name = channels.lua, type = script/lua
    provides = hooks.linking.target.singularity-channels
  }
]

wireplumber.profiles = {
  main = {
    hooks.linking.target.singularity-channels = required
  }
}
