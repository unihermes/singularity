# Singularity - Game, Chat and Media: three outputs that mix into the real one
#
# Each is a loopback: apps play into its sink side, and its stream side plays
# on the default output, following it when that changes. New streams land on
# Game (wireplumber's channels.lua); an app moved to another channel stays
# there. The shell sets Game and Chat against each other from a headset's
# ChatMix dial (services/Channels.qml).

context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Game"
      capture.props = {
        node.name = "channel.game"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        singularity.channel = "game"
      }
      playback.props = {
        node.name = "channel.game.out"
        node.description = "Game"
        node.passive = true
        audio.position = [ FL FR ]
        singularity.channel = "game"
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Chat"
      capture.props = {
        node.name = "channel.chat"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        singularity.channel = "chat"
      }
      playback.props = {
        node.name = "channel.chat.out"
        node.description = "Chat"
        node.passive = true
        audio.position = [ FL FR ]
        singularity.channel = "chat"
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Media"
      capture.props = {
        node.name = "channel.media"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        singularity.channel = "media"
      }
      playback.props = {
        node.name = "channel.media.out"
        node.description = "Media"
        node.passive = true
        audio.position = [ FL FR ]
        singularity.channel = "media"
      }
    }
  }
]
