# Singularity - Game, Chat and Media: three outputs that mix into the real one
#
# Each is a filter-chain (Media a plain loopback): apps play into its sink
# side, and its stream side plays on the default output, following it when
# that changes. New streams land on Chat, games' on Game (wireplumber's
# channels.lua); an app moved to another channel stays there. The shell sets
# Game and Chat against each other from a headset's ChatMix dial
# (services/Channels.qml).
#
# The EQs shape each channel for what plays on it, whatever the output; each
# starts 3 dB down so its highest band (+3 dB) can't clip a full-scale stream.
#   Game: rumble under 100 Hz down 4 dB, so explosions don't bury the rest;
#         2.8 kHz up 3 dB and 6 kHz up 1.5 for footsteps, reloads and the
#         cues that tell where a sound is.
#   Chat: everything under 90 Hz rolled off (no voice down there, only mic
#         thumps and hum), 250 Hz down 3 dB for boxy headset mics, 3 kHz up
#         3 dB for the words, 7.5 kHz down 2 dB for harsh esses.
#   Media: flat, as it was mixed.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Game"
      audio.channels = 2
      audio.position = [ FL FR ]
      filter.graph = {
        nodes = [
          { type = builtin name = pre label = mixer control = { "Gain 1" = 0.708 } }
          { type = builtin name = rumble label = bq_lowshelf control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = -4.0 } }
          { type = builtin name = cues label = bq_peaking control = { "Freq" = 2800.0 "Q" = 0.9 "Gain" = 3.0 } }
          { type = builtin name = detail label = bq_peaking control = { "Freq" = 6000.0 "Q" = 2.0 "Gain" = 1.5 } }
        ]
        links = [
          { output = "pre:Out" input = "rumble:In" }
          { output = "rumble:Out" input = "cues:In" }
          { output = "cues:Out" input = "detail:In" }
        ]
        inputs = [ "pre:In 1" ]
        outputs = [ "detail:Out" ]
      }
      capture.props = {
        node.name = "channel.game"
        media.class = "Audio/Sink"
        singularity.channel = "game"
      }
      playback.props = {
        node.name = "channel.game.out"
        node.description = "Game"
        node.passive = true
        singularity.channel = "game"
      }
    }
  }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Chat"
      audio.channels = 2
      audio.position = [ FL FR ]
      filter.graph = {
        nodes = [
          { type = builtin name = pre label = mixer control = { "Gain 1" = 0.708 } }
          { type = builtin name = low label = bq_highpass control = { "Freq" = 90.0 "Q" = 0.7 } }
          { type = builtin name = box label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = -3.0 } }
          { type = builtin name = words label = bq_peaking control = { "Freq" = 3000.0 "Q" = 0.9 "Gain" = 3.0 } }
          { type = builtin name = ess label = bq_peaking control = { "Freq" = 7500.0 "Q" = 2.5 "Gain" = -2.0 } }
        ]
        links = [
          { output = "pre:Out" input = "low:In" }
          { output = "low:Out" input = "box:In" }
          { output = "box:Out" input = "words:In" }
          { output = "words:Out" input = "ess:In" }
        ]
        inputs = [ "pre:In 1" ]
        outputs = [ "ess:Out" ]
      }
      capture.props = {
        node.name = "channel.chat"
        media.class = "Audio/Sink"
        singularity.channel = "chat"
      }
      playback.props = {
        node.name = "channel.chat.out"
        node.description = "Chat"
        node.passive = true
        singularity.channel = "chat"
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Media"
      capture.props = {
        node.name = "channel.media"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        singularity.channel = "media"
      }
      playback.props = {
        node.name = "channel.media.out"
        node.description = "Media"
        node.passive = true
        audio.position = [ FL FR ]
        singularity.channel = "media"
      }
    }
  }
]
